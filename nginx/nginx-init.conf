server {
    listen 80;
    server_name ${DOMAIN_NAME};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # During initial setup, just return a temporary response.
        # This allows Nginx to start without the main app being ready.
        return 200 'Temporary server for certificate validation';
    }
}
